# Локальный запуск того же образа, что и на Render
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olimp-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/app/data/dev.db
      JWT_SECRET: ${JWT_SECRET:-olympiad-docker-secret-change-me}
      SEED_ON_START: ${SEED_ON_START:-0}
      CLIENT_DIST: /app/public
    volumes:
      - olimp-data:/app/data
    ports:
      - "${PORT:-3000}:3000"

volumes:
  olimp-data:
